backend:
  name: test-repo

media_folder: "static/uploads"
public_folder: "/uploads"

collections:

  - name: "book"
    label: "书籍"
    label_singular: "书籍"
    folder: "content/book"
    create: true
    extension: "md"
    format: "frontmatter"

    slug: "{{slug}}"

    fields:
      - label: "书名"
        name: "title"
        widget: "string"

      - label: "英文书名"
        name: "originalTitle"
        widget: "string"
        required: false

      - label: "作者"
        name: "author"
        widget: "string"

      - label: "出版年份"
        name: "publicationYear"
        widget: "string"
        required: false

      - label: "简介"
        name: "description"
        widget: "text"
        required: false

      - label: "发布日期"
        name: "date"
        widget: "datetime"
        format: "YYYY-MM-DD"
        date_format: "YYYY-MM-DD"
        time_format: false

      - label: "草稿"
        name: "draft"
        widget: "boolean"
        default: false

      - label: "英文 Slug"
        name: "slug"
        widget: "string"

      - label: "封面"
        name: "cover"
        widget: "image"
        required: false

      - label: "分类"
        name: "categories"
        widget: "list"
        required: false

      - label: "标签"
        name: "tags"
        widget: "list"
        required: false

      - label: "阅读状态"
        name: "readingStatus"
        widget: "select"
        options:
          - { label: "想读", value: "want-to-read" }
          - { label: "阅读中", value: "reading" }
          - { label: "已读", value: "finished" }
          - { label: "暂停", value: "paused" }
          - { label: "弃读", value: "dropped" }
        default: "finished"

      - label: "我的评分"
        name: "rating"
        widget: "number"
        value_type: "int"
        min: 0
        max: 5
        default: 0

      - label: "开始阅读日期"
        name: "startedDate"
        widget: "datetime"
        format: "YYYY-MM-DD"
        date_format: "YYYY-MM-DD"
        time_format: false
        required: false

      - label: "完成阅读日期"
        name: "finishedDate"
        widget: "datetime"
        format: "YYYY-MM-DD"
        date_format: "YYYY-MM-DD"
        time_format: false
        required: false

      - label: "阅读笔记"
        name: "body"
        widget: "markdown"

  - name: "pages"
    label: "Pages"

    files:

      - label: "About"
        name: "about"
        file: "content/about.md"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Description", name: "description", widget: "text", required: false }
          - { label: "Body", name: "body", widget: "markdown" }

      - label: "Contact"
        name: "contact"
        file: "content/contact.md"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Description", name: "description", widget: "text", required: false }
          - { label: "Body", name: "body", widget: "markdown" }

      - label: "Privacy Policy"
        name: "privacy"
        file: "content/privacy.md"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Description", name: "description", widget: "text", required: false }
          - { label: "Body", name: "body", widget: "markdown" }

      - label: "Terms of Use"
        name: "terms"
        file: "content/terms.md"
        fields:
          - { label: "Title", name: "title", widget: "string" }
          - { label: "Description", name: "description", widget: "text", required: false }
          - { label: "Body", name: "body", widget: "markdown" }
