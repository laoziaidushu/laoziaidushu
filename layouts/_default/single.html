{{ define "main" }}

<article class="standard-page">
  <div class="container standard-page-container">

    <header class="standard-page-header">
      <h1>{{ .Title }}</h1>

      {{ with .Description }}
        <p>{{ . }}</p>
      {{ end }}
    </header>

    <div class="standard-page-content">
      {{ .Content }}
    </div>

  </div>
</article>

{{ end }}
