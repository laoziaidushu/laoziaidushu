{{- $categories := slice
  "business"
  "psychology"
  "finance"
  "philosophy"
  "history"
  "technology"
  "growth"
-}}

<nav class="book-category-nav" aria-label="书籍分类">

  <a
    href="{{ "/book/" | relURL }}"
    {{ if eq .RelPermalink "/book/" }}aria-current="page"{{ end }}
  >
    全部
  </a>

  {{- range $categories }}

    {{- $term := site.GetPage (printf "/categories/%s" .) }}

    {{- if and $term (gt (len $term.Pages) 0) }}

      <a
        href="{{ $term.RelPermalink }}"
        {{ if eq $.RelPermalink $term.RelPermalink }}aria-current="page"{{ end }}
      >
        {{ $term.LinkTitle }}
      </a>

    {{- end }}

  {{- end }}

</nav>
