<header class="site-header">
  <div class="container header-inner">

    <a class="site-brand" href="{{ "/" | relURL }}">
      <span class="site-brand-name">
        {{ hugo.Data.site.name }}
      </span>

      <span class="site-brand-english">
        {{ hugo.Data.site.shortName }}
      </span>
    </a>

    <nav class="desktop-nav" aria-label="主要导航">
      {{ range hugo.Data.navigation.main }}

        {{ if eq .key "more" }}

          <div class="nav-more">
            <button class="nav-more-button" type="button">
              {{ .name }}
            </button>

            <div class="nav-more-menu">
              {{ range hugo.Data.navigation.more }}
                <a href="{{ .url | relURL }}">
                  {{ .name }}
                </a>
              {{ end }}
            </div>
          </div>

        {{ else }}

          <a href="{{ .url | relURL }}">
            {{ .name }}
          </a>

        {{ end }}

      {{ end }}
    </nav>

  </div>
</header>
