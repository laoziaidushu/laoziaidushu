{{ define "main" }}

<section class="section-page">
  <div class="container">

    <header class="section-header">
      <h1>{{ .Title }}</h1>

      {{ with .Content }}
        {{ . }}
      {{ end }}
    </header>

    <div class="post-list">
      {{ range .Pages.ByDate.Reverse }}

        <article class="post-card">

          {{ partial "cover-image.html" . }}

          <h2>
            <a href="{{ .RelPermalink }}">
              {{ .Title }}
            </a>
          </h2>

          {{ with .Description }}
            <p>{{ . }}</p>
          {{ end }}

        </article>

      {{ end }}
    </div>

  </div>
</section>

{{ end }}
